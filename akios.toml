# akios.toml: what `ak` builds, boots and flashes. Paths are relative to this directory unless absolute (~ allowed).

[paths]
xnu      = "xnu"                       # our XNU fork (Apple's tag first, our commits on top)
out      = "out"                       # what ak makes: kernel, images
logs     = "~/akita/logs/ak"           # one directory a run
# (transition) what has not moved yet comes from the old tree
legacy   = "~/akita/hakios-base"

[kernel]
config   = "DEVELOPMENT"
machine  = "BCM2837"                   # the slot our platform builds in
version  = "25.6.0"                    # RC_DARWIN_KERNEL_VERSION
# the drivers built in (one build option each); ak writes config/MASTER.hakios and bsd/dev/hakios.drivers.h from this
drivers  = [
  "guard", "bt_host", "battery", "ufs", "wifi_station",
  "akita_aoc", "akita_amp", "akita_bt", "akita_torch", "akita_camera", "akita_display", "akita_gnss", "akita_mali",
  "akita_haptic", "akita_keys", "akita_touch", "akita_modem", "akita_battery", "akita_acpm", "akita_thermal",
  "akita_dvfs", "akita_rtc", "akita_power", "akita_mct", "akita_trusty", "akita_usb", "akita_wifi",
]
# what the kernel assumes when the boot line does not name an argument (pexpert/arm/pe_bootargs.c)
default_args = [
  "touchscreen=1", "buttons=1", "fuelgauge=1", "usbmux=1", "thermal=1", "dvfs=1", "mali_keep=1", "metal=1",
  "metal_plugin=../../../akita/lib/HakiosMetal", "display_flip=1", "metal_all=1",
  "root_apfs=ufs_ios_system", "var_hfs=ufs_ios_data", "cryptex_dev=ufs_ios_preboot",
  "pcie=5", "pcie_delay=10", "wifi=8", "aoc=3", "amp=2", "speaker=1", "amp_gain=17", "aocrec=1", "fb_beat=0",
  "cpuidle=1", "bt=2",
]

[userland]
# `ak userland`: the repository (userland/userland.toml says what goes into out/akios.apfs) and what it is built with.
# Its manifest names these as @key.
repo         = "userland"
toolchain    = "~/akita/hakios-base/xnu-deps/host/bin"      # xnu-clang, ld64, otool
sdk_target   = "16.5"                                        # xnu-clang's -target iOS version (as xnu-env.sh sets it)
sdk          = "~/theos/sdks/iPhoneOS27.2.sdk"
arch         = "arm64e"
ldid         = "~/theos/toolchain/linux/iphone/bin/ldid"
ipsw         = "~/akita/akios-data/ipsw-d16ap"              # the unpacked IPSW: rootfs/ (launchd jobs), var.skel, build.conf
firmware     = "~/akita/akios-data/firmware"                # its fw-*/: the vendor's files, never in git
ca_share     = "~/ca-share"                                  # QuartzCore's default.metallib (tools/ca-metallib.py)
# (transition) still in the old tree: Metal (its own repository later) and the APFS tools
metal        = "~/akita/hakios-base/hakios-metal"
metal_plugin = "~/akita/hakios-base/userland/src"           # HakiosMetalCA.m, HakiosMetal.plist
mkapfs       = "tools/apfs/mkapfs.py"
apfs_reader  = "tools/apfs/apfs.py"
carrierpack  = "tools/mkcarrierpack.py"

[iogpu]
# tools/iogpu (GPU research, read-only on these): the reference inputs it reads by default. Not needed to build.
kernelcache = "~/akita/ref/kc-24B156/kernelcache.macho"   # iOS 24B156 kernelcache, decompressed; KC.symbols.json beside it names kernel symbols
kdk         = "~/akita/ref/kdk-26B131"                    # macOS KDK 26B131: pkg/KDK.pkg/Payload (iogpu kdk extract)
mac_kexts   = "~/akita/ref/iogpu-research"                # thin arm64e macOS kexts, mac-NAME.arm64e (what iogpu kdk extract makes)
symbols     = "~/akita/ref/symbols-24B156"                # iOS 24B156 Symbols supplement (the directory holding System/, or one above)
symbols_db  = "~/akita/ref/symbols-24B156.sqlite"         # its symbol database: syms(addr, name, ...), images(path, ...)

[phone]
name     = "akita"
# the command line every boot gets (the loader adds the device's own: devices/akita/soc.args)
cmdline  = [
  "debug=0x8", "cpus=9", "ufs=2", "ufs_write=1", "torch=3", "hakios_arm64e=1",
  "wifi=8", "pcie=5",
  "ca_metallib=/akita/share/ca-share/QuartzCore-default.metallib",
  "display_hz=120", "fbwidth=1080", "fbheight=2340", "fbscale=3", "fbsubtype=2340", "fb_zc=1", "anim_max=1",
  "metal=1", "metal_plugin=../../../akita/lib/HakiosMetal", "metal_all=1", "mali_keep=1", "display_flip=1",
  "dvfs=1", "thermal=1", "skip_setup=1",
]
# the boot line is cut at about 1000 characters: past this, ak refuses to build an image
cmdline_max = 900

[test]
# RAM test boots: safety nets on (the phone comes back to Android / the bootloader by itself)
usb_lost_reboot   = 90                 # s without a USB host
loader_failsafe   = 120                # s in the new loader before it restarts the phone (no XNU by then)
test_reboot_after = 1200               # s after boot
quiet_hours       = [22, 9]            # local time: speaker=0, restart into the bootloader

[flash]
slot = "b"
# a flashed image has no kill switches: it is the owner's to use unplugged
usb_lost_reboot   = 0
test_reboot_after = 0
